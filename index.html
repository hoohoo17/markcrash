<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마크크러시</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1>마크크러시</h1>
            <div class="game-info">
                <div id="score">점수: 0</div>
                <div id="level">스테이지: 1</div>
            </div>
        </div>
        
        <div id="goals" class="goals">목표: 다이아몬드 5개 (0), TNT 3개 (0)</div>
        
        <div id="board" class="board"></div>
        
        <button id="nextLevel" class="next-level-btn" style="display: none;">다음 스테이지</button>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
